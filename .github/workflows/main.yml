name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (not strictly needed for SSH-only deployment)
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
            github@${{ secrets.VPS_IP_ADDR }} \
            "
              echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S rm -rf kenisha-site &&
              git clone ${{ secrets.REPO_URL }} || true &&
              cd \$(basename '${{ secrets.REPO_URL }}' .git) &&
              echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S bash deploy.sh -i '${{ secrets.SUDO_PASSWORD }}'
            "
